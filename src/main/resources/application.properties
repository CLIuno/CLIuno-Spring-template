spring.application.name=cliuno-spring-template
server.port=${PORT:3000}

spring.datasource.url=jdbc:sqlite:${DB_FILE:db.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Image uploads: 5 MB, matching every other CLIuno backend template
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# The shared CLIuno contract serialises entity fields as snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

cliuno.jwt.secret=${JWT_SECRET_KEY:dev-jwt-secret-change-me-please-32chars}
cliuno.jwt.refresh-secret=${REFRESH_JWT_SECRET_KEY:dev-refresh-secret-change-me-32chars!}
